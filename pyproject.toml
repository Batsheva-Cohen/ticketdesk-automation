[project]
name = "ticketdesk-automation"
version = "0.1.0"
description = "TicketDesk: a sample app plus a full Python test automation framework"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-playwright>=0.7",
    "playwright>=1.50",
    "pytest-xdist>=3.6",
    "pytest-html>=4.1",
    "requests>=2.32",
    "selenium>=4.25",
    "jsonschema>=4.23",
    "schemathesis>=4.0",
    "pytest-bdd>=8.0",
    "axe-playwright-python>=0.1.4",
    "pillow>=10.4",
    "faker>=30.0",
    "allure-pytest>=2.13",
    "pytest-rerunfailures>=14.0",
]
load = [
    "locust>=2.32",
]
dev = [
    "ruff>=0.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented pattern