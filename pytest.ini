[pytest]
testpaths = tests
addopts = -ra --strict-markers --screenshot only-on-failure --tracing retain-on-failure --output test-results
markers =
    api: tests that talk to the REST API only
    ui: browser tests with Playwright
    db: tests that read the SQLite database directly
    e2e: end to end flows crossing API, UI and DB
    smoke: minimal set that must always pass
    workflow: ticket status transition rules
    network: tests that mock or inspect browser network traffic
    contract: response schema validation against the OpenAPI document
    security: basic security checks (injection, escaping, token handling)
    mobile: browser tests with a mobile device emulation
    bdd: Gherkin scenarios executed with pytest-bdd
    accessibility: axe-core WCAG checks
    visual: screenshot comparison against stored baselines
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %H:%M:%S